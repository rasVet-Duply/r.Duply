name: Prepare AgroStat

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p extracted
          unzip -o agrostat-firebase.zip -d extracted

      - name: Show project files
        run: |
          find extracted -maxdepth 3 -type f | head -100

      - name: Save extracted files
        run: |
          cp -r extracted/. .
          rm -rf extracted
          rm -f agrostat-firebase.zip

      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract AgroStat project" || echo "No changes"
          git push
